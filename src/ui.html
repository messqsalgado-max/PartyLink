<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<title>PartyLink</title>
<style>
  :root {
    color-scheme: dark;
    --rail: #17181c;
    --side: #1f2025;
    --main: #27282e;
    --raised: #2f3138;
    --input: #1a1b20;
    --hover: rgba(255, 255, 255, .06);
    --active: rgba(255, 255, 255, .1);
    --line: rgba(255, 255, 255, .07);
    --text: #dfe1e6;
    --strong: #f4f5f7;
    --muted: #9a9ca6;
    --faint: #6d6f7a;
    --accent: #6c7cff;
    --accent-hover: #5a69ee;
    --ok: #3fbf7f;
    --warn: #f0b232;
    --bad: #ed5a5f;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--rail); color: var(--text); font: 14px/1.4 var(--font); overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select { font: inherit; color: var(--strong); background: var(--input); border: 1px solid transparent; border-radius: 6px; padding: 10px 12px; width: 100%; user-select: text; }
  input:focus, select:focus { outline: 0; border-color: var(--accent); }
  svg { display: block; fill: currentColor; }
  h1, h2, h3, p { margin: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 8px 16px; border-radius: 6px; font-weight: 600; background: var(--raised); color: var(--strong); transition: background-color .12s; }
  .btn:hover:not(:disabled) { background: #3a3c44; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.small { min-height: 30px; padding: 4px 12px; font-size: 13px; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .row { display: flex; align-items: center; gap: 12px; }
  .spread { justify-content: space-between; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .field-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
  .error { color: #ffb4b6; background: rgba(237, 90, 95, .13); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
  .notice { color: var(--text); background: rgba(108, 124, 255, .13); border-radius: 6px; padding: 10px 12px; font-size: 13px; }

  /* App layout: icon rail, channel sidebar, main area */
  .shell { display: grid; grid-template-columns: 72px 248px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; background: var(--rail); }
  .rail-btn { position: relative; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--main); color: var(--text); transition: border-radius .15s, background-color .15s, color .15s; }
  .rail-btn svg { width: 24px; height: 24px; }
  .rail-btn:hover, .rail-btn.on { border-radius: 16px; background: var(--accent); color: #fff; }
  .rail-btn::before { content: ""; position: absolute; left: -12px; width: 4px; height: 0; border-radius: 0 4px 4px 0; background: var(--strong); transition: height .15s; }
  .rail-btn:hover::before { height: 20px; }
  .rail-btn.on::before { height: 36px; }
  .rail-line { width: 32px; height: 2px; border-radius: 1px; background: var(--line); }

  .side { display: flex; flex-direction: column; min-height: 0; background: var(--side); }
  .side-head { display: flex; align-items: center; height: 48px; padding: 0 16px; border-bottom: 1px solid rgba(0, 0, 0, .3); font: 600 15px var(--display); color: var(--strong); }
  .side-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 8px; }
  .section { padding: 0 8px 4px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
  .chan { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 4px 8px; border-radius: 6px; color: var(--muted); text-align: left; font-weight: 500; }
  .chan svg { width: 20px; height: 20px; flex: none; }
  .chan:hover { background: var(--hover); color: var(--text); }
  .chan.on { background: var(--active); color: var(--strong); }
  .members { display: grid; gap: 2px; padding: 2px 0 12px 28px; }
  .member { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 2px 8px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  .avatar { display: grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; box-shadow: 0 0 0 2px transparent; transition: box-shadow .1s; }
  .avatar.alt { background: #4a4d57; }
  .avatar.big { width: 32px; height: 32px; font-size: 13px; }
  .avatar.talking { box-shadow: 0 0 0 2px var(--side), 0 0 0 4px var(--ok); }
  .member .state-icon { width: 14px; height: 14px; margin-left: auto; color: var(--bad); }
  .side-gap { height: 12px; }
  .side-note { padding: 2px 8px 16px; color: var(--faint); font-size: 13px; }
  .head-tabs { display: flex; gap: 4px; margin-left: 12px; }
  .head-tab { padding: 4px 12px; border-radius: 6px; color: var(--muted); font: 500 14px var(--font); }
  .head-tab:hover { background: var(--hover); color: var(--text); }
  .head-tab.on { background: var(--active); color: var(--strong); }
  .icon-btn.on { background: var(--active); color: var(--strong); }
  .empty { display: grid; gap: 12px; justify-items: center; width: min(460px, 100%); text-align: center; }
  .empty h1 { color: var(--strong); font: 700 22px/1.2 var(--display); }
  .empty p { color: var(--muted); }
  .empty-icon { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--side); color: var(--faint); }
  .empty-icon svg { width: 36px; height: 36px; }

  .voice-panel { padding: 8px 10px; border-top: 1px solid var(--line); background: #1b1c21; }
  .voice-state { color: var(--ok); font-size: 13px; font-weight: 700; }
  .voice-state.waiting { color: var(--warn); }
  .voice-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 6px; color: var(--muted); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--strong); }
  .icon-btn.off { color: var(--bad); background: rgba(237, 90, 95, .13); }
  .user-panel { display: flex; align-items: center; gap: 8px; padding: 8px; background: #1b1c21; }
  .user-names { flex: 1; min-width: 0; }
  .user-name { color: var(--strong); font-size: 13px; font-weight: 600; }
  .user-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--main); }
  .main-head { display: flex; align-items: center; gap: 8px; height: 48px; flex: none; padding: 0 16px; border-bottom: 1px solid rgba(0, 0, 0, .25); color: var(--strong); font: 600 15px var(--display); }
  .main-head svg { width: 20px; height: 20px; color: var(--faint); }
  .main-head .hint { margin-left: auto; color: var(--muted); font: 400 12px var(--font); }
  .page { flex: 1; min-height: 0; overflow-y: auto; padding: 32px; }
  .page-inner { display: grid; gap: 20px; max-width: 720px; margin: 0 auto; }
  .page-title { color: var(--strong); font: 700 24px/1.2 var(--display); }
  .card { display: grid; gap: 12px; padding: 20px; border-radius: 8px; background: var(--side); }
  .card h3 { color: var(--strong); font: 600 15px var(--display); }

  .center-page { display: grid; place-items: center; }
  .connect-card { display: grid; gap: 16px; width: min(440px, 100%); padding: 32px; border-radius: 8px; background: var(--side); }
  .connect-card h1 { color: var(--strong); font: 700 24px/1.2 var(--display); text-align: center; }
  .connect-card > p { color: var(--muted); text-align: center; }
  .code-input { font: 600 20px var(--mono); letter-spacing: .3em; text-align: center; }

  .stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; background: #111216; }
  #screen { display: block; outline: 0; cursor: default; }
  #screen:focus { box-shadow: 0 0 0 2px var(--accent); }
  .stage-msg { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: 80%; padding: 8px 14px; border-radius: 6px; background: rgba(0, 0, 0, .75); color: var(--text); font-size: 13px; text-align: center; }

  .code-tiles { display: flex; justify-content: center; gap: 8px; }
  .code-tile { display: grid; place-items: center; width: 52px; height: 64px; border-radius: 8px; background: var(--input); color: var(--strong); font: 700 30px var(--mono); }
  .facts { display: grid; gap: 8px; }
  .fact { display: flex; justify-content: space-between; gap: 16px; }
  .fact > span:first-child { color: var(--muted); }
  .fact > span:last-child { min-width: 0; color: var(--strong); text-align: right; overflow-wrap: anywhere; user-select: text; }
  .notes { display: grid; gap: 4px; max-height: 140px; overflow-y: auto; color: var(--muted); font-size: 13px; }

  /* Checklist */
  .checks { display: grid; gap: 6px; }
  .check { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--raised); }
  .check-mark { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 800; line-height: 1; }
  .check-mark.ok { background: var(--ok); }
  .check-mark.warn { background: var(--warn); color: #241a00; }
  .check-mark.fail { background: var(--bad); }
  .check-mark.info { background: #565965; }
  .check-label { color: var(--strong); font-weight: 600; }
  .check-detail { color: var(--muted); font-size: 13px; }
  .check-fix { margin-top: 2px; color: var(--text); font-size: 13px; }
  .tick { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--raised); cursor: pointer; }
  .tick input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); }

  .meter { position: relative; height: 10px; overflow: hidden; border-radius: 5px; background: var(--input); }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px; background: var(--ok); transition: width .08s linear; }

  /* Setup wizard */
  .wizard { display: grid; place-items: center; height: 100%; overflow-y: auto; padding: 24px; background: radial-gradient(900px 500px at 50% -10%, rgba(108, 124, 255, .25), transparent 70%), var(--rail); }
  .wiz-card { display: grid; gap: 20px; width: min(600px, 100%); padding: 32px; border-radius: 10px; background: var(--main); box-shadow: 0 16px 48px rgba(0, 0, 0, .4); }
  .wiz-card h1 { color: var(--strong); font: 700 26px/1.2 var(--display); text-align: center; }
  .wiz-sub { color: var(--muted); text-align: center; }
  .wiz-dots { display: flex; justify-content: center; gap: 6px; }
  .wiz-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--raised); }
  .wiz-dot.on { background: var(--accent); }
  .wiz-logo { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto; border-radius: 22px; background: var(--accent); color: #fff; }
  .wiz-logo svg { width: 42px; height: 42px; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .role { display: grid; gap: 8px; padding: 20px; border-radius: 8px; background: var(--raised); text-align: left; transition: background-color .12s; }
  .role:hover { background: #3a3c44; }
  .role svg { width: 28px; height: 28px; color: var(--accent); }
  .role b { color: var(--strong); font: 600 16px var(--display); }
  .role span { color: var(--muted); font-size: 13px; }
  .wiz-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .scroll-list { max-height: 44vh; overflow-y: auto; padding-right: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="wizard" class="wizard" hidden></div>
<div id="shell" class="shell" hidden>
  <nav class="rail" aria-label="Sections">
    <button class="rail-btn" id="rail-friends" title="Friends" aria-label="Friends"></button>
    <div class="rail-line"></div>
  </nav>
  <aside class="side">
    <div class="side-head">Parties</div>
    <div class="side-body" id="side-body"></div>
    <div class="voice-panel" id="voice-panel" hidden></div>
    <div class="user-panel" id="user-panel"></div>
  </aside>
  <main class="main">
    <header class="main-head" id="main-head"></header>
    <div id="page-friends" class="page center-page" hidden></div>
    <div id="party-connect" class="page center-page" hidden></div>
    <div id="party-stage" class="stage" hidden>
      <canvas id="screen" tabindex="0" aria-label="The other PC's shared window"></canvas>
      <div class="stage-msg" id="stage-msg" hidden></div>
    </div>
    <div id="party-host" class="page" hidden></div>
    <div id="page-setup" class="page" hidden></div>
    <div id="page-audio" class="page" hidden></div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const post = (message) => { if (window.ipc) window.ipc.postMessage(JSON.stringify(message)); };
  const store = {
    get(key) { try { return localStorage.getItem("pl:" + key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem("pl:" + key, value); } catch {} },
  };

  /** Builds an element. Text always goes through textContent, so device and window names can't inject markup. */
  function h(tag, props = {}, ...children) {
    const element = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "class") element.className = value;
      else if (key === "html") element.innerHTML = value; // only ever used with the icon constants below
      else if (key.startsWith("on")) element.addEventListener(key.slice(2), value);
      else if (value === true) element.setAttribute(key, "");
      else if (value !== false && value != null) element.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child != null && child !== false) element.append(child);
    }
    return element;
  }

  const svg = (path) => `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
  const ICON = {
    friends: svg('<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-7 1.600-7 4v3h14v-3c0-2.400-3.700-4-7-4Zm7-2a3.500 3.500 0 1 0-1.300-6.750A6 6 0 0 1 14.700 10.750 3.500 3.500 0 0 0 16 11Zm1.200 2.100A5.500 5.500 0 0 1 18 17v3h4v-3c0-1.900-2.300-3.400-4.800-3.900Z"/>'),
    logo: svg('<path d="M8.5 6.5a5.5 5.5 0 0 1 4.9 3h-2.4a3.3 3.3 0 1 0 0 5h2.4a5.5 5.5 0 1 1-4.9-8Z"/><path d="M15.5 6.5a5.5 5.5 0 1 1-4.9 8H13a3.3 3.3 0 1 0 0-5h-2.4a5.5 5.5 0 0 1 4.9-3Z"/>'),
    gear: svg('<circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="12" cy="12" r="8.8" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="3.46 3.45"/>'),
    check: svg('<path d="M9.5 16.6 5.4 12.5 4 13.9l5.5 5.5L20 8.9l-1.4-1.4z"/>'),
    audio: svg('<path d="M3 9v6h4l5 4V5L7 9H3Zm12.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5ZM13.5 4.3v2.1a6 6 0 0 1 0 11.2v2.1a8 8 0 0 0 0-15.4Z"/>'),
    mic: svg('<path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9h-2Z"/>'),
    micOff: svg('<path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9h-2Z"/><path d="m4.4 3 16.6 16.6-1.4 1.4L3 4.4z"/>'),
    head: svg('<path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a7 7 0 0 1 14 0h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9Z"/>'),
    headOff: svg('<path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a7 7 0 0 1 14 0h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9Z"/><path d="m4.4 3 16.6 16.6-1.4 1.4L3 4.4z"/>'),
    hangup: svg('<path d="M12 9c-3.2 0-6.2.8-8.8 2.4-.8.5-1.2 1.4-1 2.3l.5 2c.2.8 1 1.3 1.8 1.1l3.3-.8c.7-.2 1.2-.8 1.2-1.5v-1.8a11 11 0 0 1 6 0v1.8c0 .7.5 1.3 1.2 1.5l3.3.8c.8.2 1.6-.3 1.8-1.1l.5-2c.2-.9-.2-1.8-1-2.3A17 17 0 0 0 12 9Z"/>'),
    screen: svg('<path d="M3 4h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-8v2h3v2H8v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm1 2v10h16V6H4Z"/>'),
    voice: svg('<path d="M3 9v6h4l5 4V5L7 9H3Zm12.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5Z"/>'),
    desk: svg('<path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7v2h4v2H7v-2h4v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>'),
    gamepad: svg('<path d="M7.5 7h9a5.5 5.5 0 0 1 5.3 7l-.6 2.2a2.6 2.6 0 0 1-4.5 1L15 15.4H9l-1.7 1.8a2.6 2.6 0 0 1-4.5-1L2.2 14a5.5 5.5 0 0 1 5.3-7ZM7 9.5v1.3H5.7v1.7H7v1.3h1.7v-1.3H10v-1.700H8.700V9.500H7Zm9.300 0a1.100 1.100 0 1 0 0 2.200 1.100 1.100 0 0 0 0-2.200Zm2 2.700a1.100 1.100 0 1 0 0 2.200 1.100 1.100 0 0 0 0-2.200Z"/>'),
  };

  const ACTION_LABEL = {
    install: "Install",
    firewall: "Allow",
    cable: "Install VB-Cable",
    ldplayer: "Open download page",
    network: "Open settings",
    sound: "Sound settings",
  };
  const TASK_LABEL = { install: "Installing PartyLink…", firewall: "Waiting for Windows to allow the firewall rule…", cable: "Downloading VB-Cable. Approve the Windows prompt, click Install Driver, then close its window." };

  let state = null;
  // Views: friends (first rail button), stream (the second PC's picture), settings (the gear).
  let view = null;
  let settingsTab = "connection";
  let hadSession = false;
  let wizardStep = null;
  let stateKey = {};
  const once = (name, value) => {
    const key = JSON.stringify(value);
    if (stateKey[name] === key) return false;
    stateKey[name] = key;
    return true;
  };

  /* ---------- Shared pieces ---------- */
  function checklist() {
    const check = state.check;
    const task = state.task;
    const list = h("div", { class: "checks" });
    if (!check.items.length) {
      list.append(h("div", { class: "muted small" }, check.running ? "Checking this PC…" : "No results yet."));
    }
    for (const item of check.items) {
      const mark = { ok: "✓", warn: "!", fail: "✕", info: "i" }[item.state] || "i";
      const canAct = item.action && item.state !== "ok";
      list.append(h("div", { class: "check" },
        h("div", { class: "check-mark " + item.state, "aria-label": item.state }, mark),
        h("div", {},
          h("div", { class: "check-label" }, item.label),
          h("div", { class: "check-detail" }, item.detail),
          item.fix ? h("div", { class: "check-fix" }, item.fix) : null),
        canAct ? h("button", {
          class: "btn small",
          disabled: Boolean(task.running),
          onclick: () => post({ t: "action", action: item.action }),
        }, ACTION_LABEL[item.action] || "Fix") : h("span")));
    }
    const out = [list];
    if (task.running) out.push(h("div", { class: "notice" }, TASK_LABEL[task.running] || "Working…"));
    else if (task.message) out.push(h("div", { class: task.error ? "error" : "notice" }, task.message));
    return out;
  }

  function checkSummary() {
    const items = state.check.items;
    const failed = items.filter((i) => i.state === "fail").length;
    const warned = items.filter((i) => i.state === "warn").length;
    if (state.check.running) return "Checking…";
    if (!items.length) return "";

  const talkUntil = { you: 0, party: 0 };
  function updateLevels() {
    const session = state.view.session;
    const now = performance.now();
    if (session) {
      if (session.micLevel > 0.04) talkUntil.you = now + 300;
      if (session.partyLevel > 0.02) talkUntil.party = now + 300;
      const you = $("talk-you");
      const party = $("talk-party");
      if (you) you.classList.toggle("talking", now < talkUntil.you && !state.view.muted && !state.view.deafened);
      if (party) party.classList.toggle("talking", now < talkUntil.party && !state.view.deafened);
    }
    const level = session ? session.micLevel : state.testLevel || 0;
    updateMeter("page-meter", level);
    updateMeter("wiz-meter", state.testLevel || 0);
  }

  function render() {
    if (!state) return;
    const inWizard = !state.setupDone;
    if (inWizard && !wizardStep) wizardStep = state.role ? "checks" : "welcome";
    $("wizard").hidden = !inWizard;
    $("shell").hidden = inWizard;
    if (inWizard) {
      const key = wizardStep === "audio"
        ? [wizardStep, state.micName, state.outputName, state.role]
        : [wizardStep, state.role, state.check, state.task];
      if (once("wizard", key)) renderWizard();
      if (state.role && !state.check.items.length && !state.check.running && !render.checked) {
        render.checked = true;
        post({ t: "check" });
      }
    } else {
      const hasSession = Boolean(state.view.session);
      // Hosts open on the code they need to read out; viewers open on Friends.
      if (!view) view = state.role === "host" ? "settings" : "friends";
      // Connecting opens the picture. Losing the connection shows why, on the Connection tab.
      if (hasSession && !hadSession) { view = "stream"; stateKey.side = stateKey.head = stateKey.panels = null; }
      if (!hasSession && hadSession && view === "stream") { view = "settings"; settingsTab = "connection"; stateKey.side = stateKey.head = stateKey.panels = null; }
      if (!hasSession && view === "stream") { view = "settings"; settingsTab = "connection"; }
      hadSession = hasSession;
      renderSide();
      renderPanels();
      renderHead();
      renderPages();
    }
    updateLevels();
  }

  /* ---------- Polling ---------- */
  async function poll() {
    try {
      const response = await fetch("/state");
      state = await response.json();
      render();
    } catch {}
    const fast = state && (state.view.session || state.testLevel != null);
    setTimeout(poll, fast ? 120 : 400);
  }

  /* ---------- The stream: draws frames and sends input ---------- */
  const screen = $("screen");
  const stage = $("party-stage");
  const context = screen.getContext("2d");
  let serial = 0;
  let frameW = 0;
  let frameH = 0;

  function fitScreen() {
    if (!frameW || !frameH) return;
    const scale = Math.min(stage.clientWidth / frameW, stage.clientHeight / frameH);
    screen.style.width = Math.max(1, Math.round(frameW * scale)) + "px";
    screen.style.height = Math.max(1, Math.round(frameH * scale)) + "px";
  }
  new ResizeObserver(fitScreen).observe(stage);

  async function pollFrames() {
    if (state && state.view.session && !stage.hidden && state.view.session.serial > serial) {
      try {
        const wanted = state.view.session.serial;
        const response = await fetch("/frame?since=" + serial);
        if (response.status === 200) {
          const bitmap = await createImageBitmap(await response.blob());
          if (bitmap.width !== frameW || bitmap.height !== frameH) {
            frameW = screen.width = bitmap.width;
            frameH = screen.height = bitmap.height;
            fitScreen();
          }
          context.drawImage(bitmap, 0, 0);
          bitmap.close();
          serial = wanted;
        }
      } catch {}
    } else if (state && !state.view.session) {
      serial = 0;
    }
    setTimeout(pollFrames, 40);
  }

  const send = (message) => post({ t: "input", ...message });
  let movePending = null;
  function position(event) {
    const box = screen.getBoundingClientRect();
    return { x: (event.clientX - box.left) / box.width, y: (event.clientY - box.top) / box.height };
  }
  screen.addEventListener("pointermove", (event) => {
    if (!movePending) {
      requestAnimationFrame(() => {
        send({ k: "move", ...movePending });
        movePending = null;
      });
    }
    movePending = position(event);
  });
  const heldButtons = new Set();
  screen.addEventListener("pointerdown", (event) => {
    screen.focus();
    screen.setPointerCapture(event.pointerId);
    heldButtons.add(event.button);
    send({ k: "move", ...position(event) });
    send({ k: "button", button: event.button, down: true });
    event.preventDefault();
  });
  screen.addEventListener("pointerup", (event) => {
    heldButtons.delete(event.button);
    send({ k: "move", ...position(event) });
    send({ k: "button", button: event.button, down: false });
    event.preventDefault();
  });
  screen.addEventListener("contextmenu", (event) => event.preventDefault());
  screen.addEventListener("wheel", (event) => {
    const lines = -Math.sign(event.deltaY) * Math.max(1, Math.round(Math.abs(event.deltaY) / 100));
    if (lines) send({ k: "scroll", lines });
    event.preventDefault();
  }, { passive: false });

  // Printable characters travel as text, so the other PC's keyboard layout doesn't matter.
  // Everything else, and anything with Ctrl or Alt, travels as a key press.
  const heldKeys = new Set();
  screen.addEventListener("keydown", (event) => {
    event.preventDefault();
    const printable = event.key.length <= 2 && [...event.key].length === 1;
    if (printable && !event.ctrlKey && !event.altKey && !event.metaKey) {
      send({ k: "char", c: event.key.codePointAt(0) });
    } else if (event.keyCode) {
      heldKeys.add(event.keyCode);
      send({ k: "key", vk: event.keyCode, down: true });
    }
  });
  screen.addEventListener("keyup", (event) => {
    event.preventDefault();
    if (heldKeys.delete(event.keyCode)) send({ k: "key", vk: event.keyCode, down: false });
  });
  // Never leave anything stuck down on the other PC when focus moves away.
  function releaseAll() {
    for (const vk of heldKeys) send({ k: "key", vk, down: false });
    heldKeys.clear();
    for (const button of heldButtons) send({ k: "button", button, down: false });
    heldButtons.clear();
  }
  screen.addEventListener("blur", releaseAll);
  window.addEventListener("blur", releaseAll);

  /* ---------- Start ---------- */
  $("rail-friends").innerHTML = ICON.friends;
  $("rail-friends").addEventListener("click", () => setView("friends"));
  poll();
  pollFrames();
})();
</script>
</body>
</html>

[package]
name = "partylink"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
cpal = "0.18.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_System_Console"] }
wry = "0.57.1"
xcap = "0.9.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
